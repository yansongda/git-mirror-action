name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu = GitHub runner 生产环境; macos = 自带 bash 3.2，验证兼容性
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: 语法检查 (bash -n)
        run: |
          for f in scripts/*.sh scripts/platforms/*.sh tests/*.sh tests/lib/*.sh tests/mocks/*; do
            bash -n "$f"
          done
          echo "全部语法 OK ($(bash --version | head -1))"

      # 静态检查与 OS 无关，仅 ubuntu 跑一次；--severity=warning 过滤 note 级噪音
      # （tr 'A-Z' 等为 bash 3.2 兼容刻意写法，不采纳 SC2018/2019 建议）
      - name: shellcheck 静态检查
        if: matrix.os == 'ubuntu-latest'
        run: |
          shellcheck --version | head -2
          shellcheck --severity=warning \
            scripts/*.sh scripts/platforms/*.sh tests/*.sh tests/lib/*.sh tests/mocks/*

      - name: 单元与集成测试
        run: bash tests/run.sh
