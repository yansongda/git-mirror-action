name: Git Mirror Action
description: >-
  Mirror all GitHub repos of a user or organization (including private ones)
  to Gitee / GitCode and other git platforms. Zero third-party action
  dependencies: only bash / git / curl / jq / ssh that ship with the runner.
author: yansongda
branding:
  icon: repeat
  color: blue

inputs:
  src_account:
    description: 'Source GitHub username or organization name'
    required: true
  src_token:
    description: 'GitHub Personal Access Token with repo scope (read access, including private repos)'
    required: true
  src_account_type:
    description: 'Source account type: user or org'
    required: false
    default: 'user'
  blacklist:
    description: 'Comma-separated repo names to skip'
    required: false
    default: ''
  whitelist:
    description: 'Comma-separated repo names to sync only (blacklist still applies)'
    required: false
    default: ''
  skip_forks:
    description: 'Skip forked repos (true/false)'
    required: false
    default: 'true'
  skip_archived:
    description: 'Skip archived repos (true/false)'
    required: false
    default: 'false'
  dst_private:
    description: 'Destination repo visibility: auto (follow source) / true (all private) / false (all public)'
    required: false
    default: 'auto'
  concurrency:
    description: 'Number of repos to sync in parallel'
    required: false
    default: '4'
  repo_timeout:
    description: 'Timeout in seconds for each git command'
    required: false
    default: '600'
  dry_run:
    description: 'Only list repos and check destination status, no clone/push (true/false)'
    required: false
    default: 'false'
  debug:
    description: 'Print per-repo logs on failure (true/false)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Run mirror script
      shell: bash
      env:
        SRC_ACCOUNT: ${{ inputs.src_account }}
        SRC_TOKEN: ${{ inputs.src_token }}
        SRC_ACCOUNT_TYPE: ${{ inputs.src_account_type }}
        BLACKLIST: ${{ inputs.blacklist }}
        WHITELIST: ${{ inputs.whitelist }}
        SKIP_FORKS: ${{ inputs.skip_forks }}
        SKIP_ARCHIVED: ${{ inputs.skip_archived }}
        DST_PRIVATE: ${{ inputs.dst_private }}
        CONCURRENCY: ${{ inputs.concurrency }}
        REPO_TIMEOUT: ${{ inputs.repo_timeout }}
        DRY_RUN: ${{ inputs.dry_run }}
        DEBUG: ${{ inputs.debug }}
      run: |
        bash "${{ github.action_path }}/scripts/mirror.sh"
